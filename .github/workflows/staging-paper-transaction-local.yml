name: Isolated Staging Paper BUY Transaction (local only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/staging-paper-transaction-local.yml"
      - "tests/supabase/staging-paper-transaction-local.py"
      - "drizzle/migrations/**"
      - "src/features/trading/**"
  workflow_dispatch:

# No deployment, GitHub secrets, real exchange tokens or hosted credentials.
permissions:
  contents: read

jobs:
  disposable-paper-rpc:
    name: Real Supabase Auth + persisted paper-only RPC on disposable localhost
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PGHOST: "127.0.0.1"
      PGPORT: "54322"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3

      - name: Install local PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start disposable local Supabase, never link to a remote project
        run: |
          supabase start -x studio,realtime,storage-api,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor
          env_file="$RUNNER_TEMP/supabase-local-paper.env"
          # Supabase CLI can return an empty env export immediately after startup.
          # Retry local status until BOTH independent keys have actually appeared.
          for attempt in $(seq 1 12); do
            supabase status -o env > "$env_file" 2>/dev/null || true
            if grep -Eq '^(ANON_KEY|PUBLISHABLE_KEY)=' "$env_file" &&
               grep -Eq '^(SERVICE_ROLE_KEY|SECRET_KEY)=' "$env_file"; then
              break
            fi
            supabase status --env --output-format text > "$env_file" 2>/dev/null || true
            if grep -Eq '^(ANON_KEY|PUBLISHABLE_KEY)=' "$env_file" &&
               grep -Eq '^(SERVICE_ROLE_KEY|SECRET_KEY)=' "$env_file"; then
              break
            fi
            sleep 3
          done
          if ! grep -Eq '^(ANON_KEY|PUBLISHABLE_KEY)=' "$env_file" ||
             ! grep -Eq '^(SERVICE_ROLE_KEY|SECRET_KEY)=' "$env_file"; then
            echo "::error::Local Supabase CLI failed to export both local keys; refusing to test."
            exit 1
          fi
          chmod 600 "$env_file"
          echo "SUPABASE_LOCAL_ENV_FILE=$env_file" >> "$GITHUB_ENV"

      - name: Install SQL migrations only in localhost PostgreSQL
        run: |
          for migration in \
            drizzle/migrations/0000_migration.sql \
            drizzle/migrations/0001_paper_account_integrity.sql \
            drizzle/migrations/0002_atomic_paper_buy.sql \
            drizzle/migrations/0004_paper_buy_min_notional.sql
          do
            psql -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          psql -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          sleep 3

      - name: Prove least-privilege RPC and single active signup trigger
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF has_function_privilege('anon',
                  'public.execute_paper_buy(uuid,text,text,text,numeric,numeric,numeric,numeric,timestamptz)',
                  'EXECUTE')
               OR has_function_privilege('authenticated',
                  'public.execute_paper_buy(uuid,text,text,text,numeric,numeric,numeric,numeric,timestamptz)',
                  'EXECUTE')
               OR NOT has_function_privilege('service_role',
                  'public.execute_paper_buy(uuid,text,text,text,numeric,numeric,numeric,numeric,timestamptz)',
                  'EXECUTE') THEN
              RAISE EXCEPTION 'Unsafe execute_paper_buy privileges';
            END IF;
            IF (SELECT count(*) FROM pg_trigger t
                  WHERE t.tgrelid='auth.users'::regclass
                    AND NOT t.tgisinternal AND t.tgenabled IN ('O','A')
                    AND t.tgfoid='public.handle_new_user()'::regprocedure)<>1 THEN
              RAISE EXCEPTION 'Missing or duplicate Supabase Auth trigger';
            END IF;
          END $$;
          SQL

      - name: Exercise one real simulated DB trade and prove immutable rejection paths
        run: python3 tests/supabase/staging-paper-transaction-local.py

      - name: Destroy database, disposable users and all test trades
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/supabase-local-paper.env"
          supabase stop --no-backup || true
