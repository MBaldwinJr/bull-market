name: PostgreSQL Paper Buy Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-paper-buy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: paper_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable schema
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/paper-buy-fixture.sql
      - name: Apply production-like database constraints
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/paper-buy-production-constraints.sql
      - name: Install transaction function in disposable database
        run: psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0002_atomic_paper_buy.sql
      - name: Verify paper execution SQL contract
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/paper-buy-contract.sql
      - name: Verify SQL function privileges
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/paper-buy-privileges.sql
      - name: Reject missing owner configuration records
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/paper-buy-missing-records.sql
      - name: Verify cross-owner asset and strategy isolation
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/paper-buy-owner-isolation.sql
      - name: Reject unsafe risk and bot configurations
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/paper-buy-risk-safety.sql
      - name: Reject invalid numeric boundaries
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/paper-buy-numeric-boundaries.sql
      - name: Reject invalid inputs without side effects
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/paper-buy-invalid-inputs.sql
      - name: Verify rollback after a forced audit failure
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/paper-buy-rollback.sql
      - name: Run real PostgreSQL integration assertions
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/paper-buy-integration.sql
      - name: Reset disposable schema and verify concurrent purchases
        run: bash tests/postgres/paper-buy-concurrency.sh
