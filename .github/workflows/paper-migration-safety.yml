name: Paper trading migration safety
on:
  pull_request:
    paths:
      - 'drizzle/migrations/**'
      - 'scripts/check-paper-migration.mjs'
      - '.github/workflows/paper-migration-safety.yml'
  push:
    branches: [main]
    paths:
      - 'drizzle/migrations/**'
      - 'scripts/check-paper-migration.mjs'
      - '.github/workflows/paper-migration-safety.yml'
jobs:
  static-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check paper trading migration invariants
        run: node scripts/check-paper-migration.mjs
